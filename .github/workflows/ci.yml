name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "img/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore TNWatch.sln

      - name: Build (warnings as errors, analyzers on – NFA06)
        run: dotnet build TNWatch.sln --no-restore -c Release

      - name: Formatting (NFA06)
        run: dotnet format TNWatch.sln --verify-no-changes --no-restore

      - name: Tests + coverage (unit + integration via Testcontainers)
        run: >
          dotnet test TNWatch.sln --no-build -c Release
          --settings coverage.runsettings --collect:"XPlat Code Coverage"
          --results-directory TestResults --logger "trx"

      - name: Coverage report + gate ≥ 80 % (NFA07)
        run: |
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage \
            -reporttypes:"TextSummary;MarkdownSummaryGithub;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, sys
          rate = float(ET.parse("coverage/Cobertura.xml").getroot().get("line-rate")) * 100
          print(f"Line coverage: {rate:.1f} %")
          sys.exit(0 if rate >= 80 else f"Coverage {rate:.1f} % is below 80 % (NFA07)")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            coverage/

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build application image (ADR-08)
        run: docker build -t tnwatch-app:ci .
